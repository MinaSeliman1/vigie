services:
  postgres:
    image: postgres:16-alpine
    container_name: vigie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vigie
      POSTGRES_USER: vigie
      POSTGRES_PASSWORD: vigie_local_only
    ports:
      - "54329:5432"
    volumes:
      - vigie-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigie -d vigie"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vigie-postgres-data:
